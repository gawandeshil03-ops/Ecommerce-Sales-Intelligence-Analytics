<text x="600" y="76" text-anchor="middle" fill="#f8fafc" font-family="Arial,sans-serif" font-size="40" font-weight="700">E-Commerce Sales Intelligence</text>
<text x="600" y="116" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="19">SQL Server • T-SQL • Power BI</text>
<g font-family="Arial,sans-serif" font-size="18" font-weight="700">
<rect x="70" y="164" width="290" height="66" rx="15" fill="#172554" stroke="#2563eb"/>
